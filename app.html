<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Classroom - Practice Page</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css?v=c578387e">
    <link rel="stylesheet" href="css/mobile-fixes.css?v=510326f0">
    <style>
        .num-pad-btn { min-height: 72px; font-size: 1.75rem; font-weight: 900; border-radius: 1.25rem; transition: all 0.15s ease-in-out; }
        .num-pad-btn:active { transform: scale(0.95); }
        .card-glow { box-shadow: 0 10px 30px -5px rgba(99, 102, 241, 0.08); }
    </style>
</head>
<body class="bg-gradient-to-b from-indigo-50 via-white to-purple-50 text-slate-900 min-h-screen flex flex-col font-sans antialiased selection:bg-indigo-100">

    <!-- Simple Classroom Top Navigation Header -->
    <header class="bg-white/90 backdrop-blur-md border-b border-indigo-100 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
        <a href="index.html" class="text-xl font-black text-indigo-600 hover:opacity-80 transition-opacity">&larr; Exit Classroom</a>
        <div class="flex space-x-4 font-mono text-xs text-slate-600">
            <div class="bg-slate-100 px-3 py-1.5 rounded-lg">Questions: <span id="streak-counter" class="font-bold text-indigo-600">0</span></div>
            <div class="bg-amber-50 px-3 py-1.5 rounded-lg border border-amber-200 text-amber-700">Stars: <span id="badge-counter" class="font-bold">⭐</span></div>
        </div>
    </header>

    <!-- Main Active Learning Stage -->
    <main class="flex-1 max-w-2xl w-full mx-auto p-4 flex flex-col justify-center space-y-6 my-4">
        
        <!-- Friendly Assistant Bubbles Box Spotlight -->
        <div id="bubbles-coach-container" class="w-full">
            <div class="flex flex-col sm:flex-row items-center space-y-3 sm:space-y-0 sm:space-x-4 p-5 bg-gradient-to-r from-indigo-50 to-purple-50 border-2 border-indigo-100 rounded-2xl animate-pulse">
                <div class="text-4xl select-none">🫧</div>
                <div class="text-center sm:text-left">
                    <p class="text-base font-bold text-slate-700">Loading your math sandbox workspace...</p>
                </div>
            </div>
        </div>

        <!-- The Big Math Question Display Box Panel -->
        <div class="bg-white border-2 border-indigo-100 rounded-3xl p-8 card-glow text-center space-y-6">
            <div class="flex justify-center items-center space-x-4">
                <!-- Large clear question font for kids and special-ed clarity -->
                <div id="math-problem-display" class="text-6xl sm:text-7xl font-black tracking-tight text-slate-900 select-none">
                    3 + 2 = ?
                </div>
                <button id="audio-readout-btn" class="p-3 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-full text-2xl transition-colors" title="Listen to question">
                    🔊
                </button>
            </div>

            <!-- Current input text placeholder display line -->
            <div class="max-w-[200px] mx-auto bg-slate-50 border-2 border-dashed border-slate-200 rounded-2xl py-3 text-3xl font-black text-indigo-600 font-mono" id="current-answer-input">
                ?
            </div>
        </div>

        <!-- Large High-Accessibility Number Pad Input Matrix Grid -->
        <div class="bg-white border border-indigo-100 rounded-3xl p-4 card-glow grid grid-cols-3 gap-3">
            <button class="num-pad-btn bg-slate-50 hover:bg-indigo-50 border border-slate-200/60 text-slate-800" onclick="appendNum(1)">1</button>
            <button class="num-pad-btn bg-slate-50 hover:bg-indigo-50 border border-slate-200/60 text-slate-800" onclick="appendNum(2)">2</button>
            <button class="num-pad-btn bg-slate-50 hover:bg-indigo-50 border border-slate-200/60 text-slate-800" onclick="appendNum(3)">3</button>
            
            <button class="num-pad-btn bg-slate-50 hover:bg-indigo-50 border border-slate-200/60 text-slate-800" onclick="appendNum(4)">4</button>
            <button class="num-pad-btn bg-slate-50 hover:bg-indigo-50 border border-slate-200/60 text-slate-800" onclick="appendNum(5)">5</button>
            <button class="num-pad-btn bg-slate-50 hover:bg-indigo-50 border border-slate-200/60 text-slate-800" onclick="appendNum(6)">6</button>
            
            <button class="num-pad-btn bg-slate-50 hover:bg-indigo-50 border border-slate-200/60 text-slate-800" onclick="appendNum(7)">7</button>
            <button class="num-pad-btn bg-slate-50 hover:bg-indigo-50 border border-slate-200/60 text-slate-800" onclick="appendNum(8)">8</button>
            <button class="num-pad-btn bg-slate-50 hover:bg-indigo-50 border border-slate-200/60 text-slate-800" onclick="appendNum(9)">9</button>
            
            <button class="num-pad-btn bg-pink-50 hover:bg-pink-100 border border-pink-200 text-pink-600 text-xl font-bold" onclick="clearInput()">Clear</button>
            <button class="num-pad-btn bg-slate-50 hover:bg-indigo-50 border border-slate-200/60 text-slate-800" onclick="appendNum(0)">0</button>
            <button class="num-pad-btn bg-emerald-500 hover:bg-emerald-600 text-white text-xl font-bold shadow-md shadow-emerald-500/20" onclick="checkMathAnswer()">Check</button>
        </div>

    </main>

    <!-- Embedded Sandbox Connector Controls -->
    <script src="app.js?v=2bdb9afc"></script>
    <script>
        let currentString = "";
        const inputDisplay = document.getElementById('current-answer-input');

        function appendNum(num) {
            if (currentString.length < 3) {
                currentString += num.toString();
                inputDisplay.textContent = currentString;
                inputDisplay.classList.remove('text-indigo-600');
                inputDisplay.classList.add('text-slate-800');
            }
        }

        function clearInput() {
            currentString = "";
            inputDisplay.textContent = "?";
            inputDisplay.classList.remove('text-slate-800');
            inputDisplay.classList.add('text-indigo-600');
        }

        function checkMathAnswer() {
            if(window.bubblesCoreInstance && currentString !== "") {
                // Call our friendly character script framework directly
                window.bubblesCoreInstance.processAnswerSuccess();
                clearInput();
            }
        }
    </script>
</body>
</html>
