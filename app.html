<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MathEasy30 - Active Practice</title>
  <style>
    body { font-family: 'Comic Sans MS', sans-serif, system-ui; background-color: #f0fdf4; color: #1e293b; margin: 0; padding: 20px; text-align: center; }
    main { max-width: 600px; margin: 30px auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 3px solid #4ade80; }
    h1 { color: #16a34a; font-size: 2.5rem; margin-bottom: 10px; }
    .math-box { background: #f8fafc; padding: 20px; border-radius: 12px; margin: 20px 0; border: 2px dashed #cbd5e1; }
    .problem { font-size: 3.5rem; font-weight: bold; color: #0f172a; margin: 10px 0; }
    .input-row { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
    input { width: 120px; font-size: 1.8rem; padding: 8px; border: 2px solid #cbd5e1; border-radius: 8px; text-align: center; }
    button { font-size: 1.3rem; padding: 10px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; background: #16a34a; color: white; }
    .score-board { font-size: 1.2rem; font-weight: bold; color: #16a34a; margin-top: 15px; }
    .app-footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #e2e8f0; font-size: 0.95rem; }
    .footer-links a { margin: 0 10px; color: #2563eb; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

  <main>
    <h1>MathEasy30 Game 🎮</h1>
    
    <section class="math-box">
      <div class="problem" id="question">0 + 0</div>
      <div class="input-row">
        <input type="number" id="answerInput" placeholder="?" autocomplete="off">
        <button type="button" onclick="checkMathAnswer()">Check</button>
      </div>
      <p id="mathFeedback" style="font-weight: bold; min-height: 24px; margin: 15px 0 0 0;"></p>
      <div class="score-board">Points: <span id="scoreValue">0</span></div>
    </section>

    <footer class="app-footer">
      <nav class="footer-links">
        <a href="index.html">Home</a>
      </nav>
      <p>&copy; 2026 MathEasy30</p>
    </footer>
  </main>

  <script>
    let num1, num2, correctAnswer;
    let score = 0;

    function generateProblem() {
        num1 = Math.floor(Math.random() * 10) + 1;
        num2 = Math.floor(Math.random() * 10) + 1;
        correctAnswer = num1 + num2;
        document.getElementById('question').innerText = `${num1} + ${num2}`;
        document.getElementById('answerInput').value = '';
        document.getElementById('answerInput').focus();
    }

    function checkMathAnswer() {
        const inputField = document.getElementById('answerInput');
        const feedback = document.getElementById('mathFeedback');
        const userAnswer = parseInt(inputField.value);

        if (isNaN(userAnswer)) return;

        if (userAnswer === correctAnswer) {
            score++;
            document.getElementById('scoreValue').innerText = score;
            feedback.innerText = "🌟 Correct answer!";
            feedback.style.color = "#16a34a";
            setTimeout(generateProblem, 1000);
        } else {
            feedback.innerText = "❌ Try again!";
            feedback.style.color = "#dc3545";
            inputField.select();
        }
    }

    document.addEventListener('DOMContentLoaded', generateProblem);
    document.getElementById('answerInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') checkMathAnswer();
    });
  </script>

</body>
</html>
