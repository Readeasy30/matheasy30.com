<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Support | MathEasy30</title>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col justify-between">

    <!-- Header Navigation -->
    <header class="bg-white border-b border-slate-200 py-4 px-6 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-2xl font-black tracking-tight text-indigo-600">math<span class="text-slate-800">easy30</span></a>
            <a href="index.html" class="text-sm font-semibold text-slate-600 hover:text-indigo-600">← Back Home</a>
        </div>
    </header>

    <!-- Main Form Panel Layout -->
    <main class="max-w-xl w-full mx-auto p-6 flex-grow">
        
        <div class="my-6 text-center">
            <h2 class="text-3xl font-extrabold text-slate-900">Get Free Support</h2>
            <p class="mt-2 text-sm text-slate-500">Have feedback or want to request custom worksheets? Let us know below.</p>
        </div>

        <!-- Secure Local Processing Client Form -->
        <form onsubmit="compileSecureMailRequest(event)" class="bg-white rounded-2xl shadow-xl border border-slate-200 p-6 md:p-8 space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Your Name</label>
                <input type="text" id="contact-name" required class="w-full p-3 border border-slate-300 rounded-xl outline-none focus:border-indigo-600 text-sm" placeholder="Alex Smith">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Topic Interest</label>
                <select id="contact-topic" class="w-full p-3 border border-slate-300 rounded-xl bg-white outline-none focus:border-indigo-600 text-sm">
                    <option value="General Feedback">General App Feedback</option>
                    <option value="Worksheet Request">Requesting Printables</option>
                    <option value="School Partnership">School / Teacher Access Inquiry</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Message Content</label>
                <textarea id="contact-msg" rows="4" required class="w-full p-3 border border-slate-300 rounded-xl outline-none focus:border-indigo-600 text-sm" placeholder="Tell us how we can make our math tools more useful for you..."></textarea>
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-4 rounded-xl transition-all shadow-md text-sm cursor-pointer text-center">
                Open Email Draft
            </button>
        </form>

    </main>

    <!-- Footer Standby -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-400">
        <p>&copy; 2026 MathEasy30. Protected Client Messaging.</p>
    </footer>

    <!-- Form Processing Logic Script Engine -->
    <script>
        function compileSecureMailRequest(event) {
            event.preventDefault();

            const name = document.getElementById('contact-name').value.trim();
            const topic = document.getElementById('contact-topic').value;
            const message = document.getElementById('contact-msg').value.trim();

            // Set up your dedicated shared network routing contact address
            const targetSupportEmail = "support@matheasy30.com";
            
            const subjectLine = encodeURIComponent(`[MathEasy30 Support Hub] ${topic}`);
            const emailBody = encodeURIComponent(`Hi MathEasy30 Support Team,\n\n${message}\n\nBest Regards,\n${name}`);

            // Programmatically launch the mail client handler completely safely
            window.location.href = `mailto:${targetSupportEmail}?subject=${subjectLine}&body=${emailBody}`;
        }
    </script>
</body>
</html>
