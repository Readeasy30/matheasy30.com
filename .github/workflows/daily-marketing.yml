name: Daily Marketing Task

on:
  schedule:
    - cron: '0 13 * * *'   # 8am CT / 1pm UTC daily — adjust if needed
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  daily-task:
    runs-on: ubuntu-latest
    steps:
      - name: Pick today's marketing task
        run: |
          set -eo pipefail

          TASKS=(
            "Share a recent lesson page on social media (pick a top-performing page from analytics)."
            "Check for broken links on the homepage and one interior page."
            "Post a tip or fact related to reading/math practice on social media."
            "Review site analytics for the past 7 days and note any traffic spikes or drops."
            "Reach out to one homeschool or ESL community/forum with a link to the site."
            "Check that all lesson level files (1-8) are loading correctly on both sites."
            "Write or schedule one short blog/update post about a new feature or lesson set."
            "Check Google Search Console for new indexing issues or crawl errors."
            "Review and respond to any user feedback or contact form submissions."
            "Cross-promote readeasy30.com and matheasy30.com to each other's audiences."
          )

          DAY_OF_YEAR=$(date +%j)
          INDEX=$(( (10#$DAY_OF_YEAR) % ${#TASKS[@]} ))
          TASK="${TASKS[$INDEX]}"

          echo "## 📋 Today's Marketing Task" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Date:** $(date +%Y-%m-%d)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$TASK" >> "$GITHUB_STEP_SUMMARY"

          echo "Task for today: $TASK"
