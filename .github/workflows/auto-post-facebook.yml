name: Auto-Post Facebook

on:
  schedule:
    - cron: '0 15 * * *'   # 10am CT daily
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Facebook configuration
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FB_PAGE_ID}" ]; then
            echo "Missing GitHub Secret: FB_PAGE_ID"
            exit 1
          fi
          if [ -z "${FB_PAGE_TOKEN}" ]; then
            echo "Missing GitHub Secret: FB_PAGE_TOKEN"
            exit 1
          fi

      - name: Post to MathEasy30 Facebook Page
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          set -eo pipefail
          DAY=$(( 10#$(date +%j) ))

          MSGS=(
            "Free daily math practice for kids — short lessons, instant feedback, no signup, no ads. 🔢"
            "Homeschool math in 30 minutes a day. Free, leveled, works on any device. ✖️➗"
            "Math anxiety? Small daily wins fix it. One short lesson a day, completely free. 💪"
            "Parents: no curriculum to buy. Open the site, pick a level, practice. Free forever. 👨‍👩‍👧"
            "Teachers & tutors: free leveled math practice your students can start today. 🍎"
          )
          I=$(( DAY % ${#MSGS[@]} ))

          RESPONSE=$(curl -s -X POST "https://graph.facebook.com/v21.0/${FB_PAGE_ID}/feed" \
            --data-urlencode "message=${MSGS[$I]}" \
            --data-urlencode "link=https://matheasy30.com/app" \
            --data-urlencode "access_token=${FB_PAGE_TOKEN}")

          echo "$RESPONSE" | grep -q '"id"' || { echo "POST FAILED: $RESPONSE"; exit 1; }
          echo "## ✅ Posted to Facebook — $(date +%Y-%m-%d)" >> "$GITHUB_STEP_SUMMARY"
          echo "${MSGS[$I]}" >> "$GITHUB_STEP_SUMMARY"
