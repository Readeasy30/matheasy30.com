<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MathEasy30 - Fun 30-Second Math Practice for Kids</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #f0fdf4; color: #166534; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    header { text-align: center; margin-bottom: 20px; }
    h1 { font-size: 2.5rem; margin: 0; color: #15803d; }
    p.subtitle { font-size: 1.1rem; color: #166534; margin-top: 5px; }
    .card { background: white; border-radius: 16px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 100%; max-width: 480px; text-align: center; border: 2px solid #bbf7d0; }
    .stats { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; font-size: 1.1rem; }
    .stat-box { background: #f0fdf4; padding: 10px 15px; border-radius: 8px; border: 1px solid #bbf7d0; }
    .problem { font-size: 3.5rem; font-weight: 800; color: #166534; margin: 20px 0; letter-spacing: 2px; }
    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
    button.btn-opt { background: #22c55e; color: white; border: none; padding: 18px; font-size: 1.8rem; font-weight: bold; border-radius: 12px; cursor: pointer; transition: transform 0.1s, background 0.2s; }
    button.btn-opt:hover { background: #16a34a; transform: translateY(-2px); }
    button.btn-opt:active { transform: translateY(0); }
    .badge-container { margin-top: 25px; font-size: 1.2rem; font-weight: bold; }
    .mode-selector { margin-bottom: 20px; display: flex; gap: 10px; justify-content: center; }
    .mode-btn { background: #e2e8f0; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    .mode-btn.active { background: #15803d; color: white; }
  </style>
</head>
<body>
  <nav class="nav-bridge" style="background: #15803d; color: white; padding: 10px 20px; width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
    <span style="font-weight: bold;">🧮 MathEasy 30</span>
    <a href="https://readeasy30.com" style="color: #fef08a; text-decoration: none; font-weight: bold; background: rgba(255,255,255,0.15); padding: 6px 14px; border-radius: 20px;">Switch to Reading 📚 ➔</a>
  </nav>
  <header>
    <h1>MathEasy 30 🧮</h1>
    <p class="subtitle">Master Math in 30 Seconds a Day!</p>
  </header>

  <div class="card">
    <div class="mode-selector">
      <button class="mode-btn active" onclick="setMode('+')">Addition (+)</button>
      <button class="mode-btn" onclick="setMode('-')">Subtraction (-)</button>
      <button class="mode-btn" onclick="setMode('×')">Multiplication (×)</button>
    </div>

    <div class="stats">
      <div class="stat-box">⭐ Score: <span id="score">0</span></div>
      <div class="stat-box">🔥 Streak: <span id="streak">0</span></div>
    </div>

    <div class="problem" id="problemDisplay">2 + 3</div>

    <div class="options" id="optionsContainer"></div>

    <div class="badge-container" id="feedback">Tap the correct answer!</div>
  </div>

  <script>
    let score = 0;
    let streak = 0;
    let currentOp = '+';
    let num1 = 0, num2 = 0, correctAnswer = 0;

    function setMode(op) {
      currentOp = op;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      generateProblem();
    }

    function generateProblem() {
      if (currentOp === '+') {
        num1 = Math.floor(Math.random() * 12) + 1;
        num2 = Math.floor(Math.random() * 12) + 1;
        correctAnswer = num1 + num2;
      } else if (currentOp === '-') {
        num1 = Math.floor(Math.random() * 12) + 6;
        num2 = Math.floor(Math.random() * num1) + 1;
        correctAnswer = num1 - num2;
      } else {
        num1 = Math.floor(Math.random() * 10) + 1;
        num2 = Math.floor(Math.random() * 10) + 1;
        correctAnswer = num1 * num2;
      }

      document.getElementById('problemDisplay').innerText = \ \ \;
      
      let answers = [correctAnswer];
      while (answers.length < 4) {
        let wrong = correctAnswer + (Math.floor(Math.random() * 7) - 3);
        if (wrong >= 0 && !answers.includes(wrong)) answers.push(wrong);
      }
      answers.sort(() => Math.random() - 0.5);

      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';
      answers.forEach(ans => {
        const btn = document.createElement('button');
        btn.className = 'btn-opt';
        btn.innerText = ans;
        btn.onclick = () => checkAnswer(ans);
        container.appendChild(btn);
      });
    }

    function checkAnswer(selected) {
      const feedback = document.getElementById('feedback');
      if (selected === correctAnswer) {
        score += 10;
        streak += 1;
        feedback.innerHTML = "🎉 Correct! Keep Going!";
        feedback.style.color = "#16a34a";
      } else {
        streak = 0;
        feedback.innerHTML = ❌ Oops! The answer was \;
        feedback.style.color = "#dc2626";
      }
      document.getElementById('score').innerText = score;
      document.getElementById('streak').innerText = streak;
      generateProblem();
    }

    generateProblem();
  </script>
</body>
</html>
