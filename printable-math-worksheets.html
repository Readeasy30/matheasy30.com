<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Math Worksheets & Cheat Sheets | MathEasy30</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            .print-page { border: none !important; box-shadow: none !important; padding: 0 !important; margin: 0 !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col justify-between">

    <!-- Active Trust Banner Container -->
    <div id="trust-banner-container" class="no-print"></div>

    <!-- Navigation Header -->
    <header class="bg-white border-b border-slate-200 py-4 px-6 sticky top-0 z-50 no-print">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-2xl font-black tracking-tight text-indigo-600">math<span class="text-slate-800">easy30</span></a>
            <a href="index.html" class="text-sm font-semibold text-slate-600 hover:text-indigo-600">← Back to Practice</a>
        </div>
    </header>

    <!-- Main Content Stream -->
    <main class="max-w-4xl w-full mx-auto p-6 flex-grow">
        
        <!-- Selection Hub Header -->
        <div class="text-center my-6 no-print">
            <h2 class="text-3xl font-extrabold text-slate-900">Zero-Stress Printables</h2>
            <p class="mt-2 text-slate-500">Tap a worksheet category below to generate a distraction-free, print-ready page instantly.</p>
            
            <!-- Sheet Selection Row -->
            <div class="flex flex-wrap justify-center gap-2 mt-6">
                <button onclick="generateSheet('survival')" class="px-4 py-2 bg-indigo-600 text-white text-sm font-bold rounded-xl shadow-md cursor-pointer">🏠 Adult Survival</button>
                <button onclick="generateSheet('fractions')" class="px-4 py-2 bg-white border border-slate-200 text-slate-700 text-sm font-semibold rounded-xl hover:bg-slate-50 cursor-pointer">🍕 Pizza Fractions</button>
                <button onclick="generateSheet('tens')" class="px-4 py-2 bg-white border border-slate-200 text-slate-700 text-sm font-semibold rounded-xl hover:bg-slate-50 cursor-pointer">⚡ Rapid Power of 10s</button>
            </div>
        </div>

        <!-- The Print-Ready Target Paper Canvas -->
        <div class="bg-white rounded-2xl shadow-xl border border-slate-200 p-8 max-w-2xl mx-auto print-page" id="sheet-canvas">
            <!-- Dynamic Sheet Title Block -->
            <div class="border-b-2 border-slate-800 pb-4 flex justify-between items-end">
                <div>
                    <h3 id="sheet-title" class="text-2xl font-bold text-slate-900">Adult Survival Math Cheat Sheet</h3>
                    <p id="sheet-subtitle" class="text-xs text-slate-500 mt-0.5">MathEasy30 Daily Practice Worksheets</p>
                </div>
                <div class="text-right text-xs text-slate-400 no-print">
                    <span>Name: _____________________</span>
                </div>
            </div>

            <!-- Dynamic Question Container Matrix -->
            <div id="questions-grid" class="mt-8 space-y-6 text-lg">
                <!-- Programmatically populated matrix grid prints here -->
            </div>

            <!-- Bottom Print Utility Action Anchor -->
            <div class="mt-12 text-center no-print border-t border-slate-100 pt-6">
                <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-8 rounded-xl transition-all shadow-lg hover:shadow-emerald-100 cursor-pointer">
                    🖨️ Print Sheet or Save as PDF
                </button>
            </div>
        </div>

    </main>

    <!-- Base Layout Configuration Module Script -->
    <script>
        const sheetDatabase = {
            survival: {
                title: "Adult Survival Math Cheat Sheet",
                subtitle: "Real-world calculations for money, split bills, and daily estimates.",
                questions: [
                    "1. Your restaurant bill is $48.00. Write down the 10% tip shortcut amount: $_________",
                    "2. Double your answer from question 1 to find a standard 20% tip amount: $_________",
                    "3. Split a $90 grocery bill evenly between 3 roommates. What does each person owe? $_________",
                    "4. An item costs $40 and is on sale for '25% off'. How many dollars do you save? $_________",
                    "5. Your paycheck is $1,200. You want to instantly save 10%. How much cash goes to savings? $_________"
                ]
            },
            fractions: {
                title: "Visual Pizza Fractions Worksheet",
                subtitle: "Simple fraction breakdowns without standard classroom jargon.",
                questions: [
                    "1. A pizza has 8 total slices. If you eat 2 slices, what fraction of the pizza is gone? (___ / ___)",
                    "2. If a pie is cut into 4 equal quarters, how many quarters make up exactly half of the pie? _________",
                    "3. You have 3 halves of an apple. How many whole apples plus leftover pieces do you have? _________",
                    "4. Which number is larger and gives you more food: 1/2 of a cake or 1/4 of a cake? _________",
                    "5. Reduce the fraction 4/8 to its simplest, easiest-to-read form: _________"
                ]
            },
            tens: {
                title: "Rapid Tens & Twos Math Engine",
                subtitle: "Mental shortcuts to bypass complex grid multiplication arrays.",
                questions: [
                    "1. Break it up: 40 + 57. (Add 40 + 50 first, then add the leftover 7). Final answer: _________",
                    "2. What is 75 minus 30? (Drop the tens spot down by 3 steps). Final answer: _________",
                    "3. Double the number 36 in your head by doubling 30, then doubling 6. Final answer: _________",
                    "4. Multiply 14 by 10 by simply placing a zero on the right side of the number: _________",
                    "5. Cut 120 directly in half. Final answer: _________"
                ]
            }
        };

        function generateSheet(sheetKey) {
            const data = sheetDatabase[sheetKey];
            if (!data) return;

            document.getElementById('sheet-title').innerText = data.title;
            document.getElementById('sheet-subtitle').innerText = data.subtitle;

            const grid = document.getElementById('questions-grid');
            grid.innerHTML = data.questions.map(q => `
                <div class="py-2 border-b border-dashed border-slate-200 pb-4">
                    <p class="text-slate-800 font-medium">${q}</p>
                </div>
            `).join('');
        }

        // Initialize with default survival calculation framework configuration state
        document.addEventListener("DOMContentLoaded", () => {
            generateSheet('survival');
        });
    </script>
    <script src="free-trust-banner.js"></script>
</body>
</html>
